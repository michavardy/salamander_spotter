# Spec §2.1 — app + Caddy (auto-HTTPS) + nightly backup sidecar.
# `docker compose up -d`.  Behind a Cloudflare/Tailscale tunnel, drop the caddy
# service and point the tunnel at app:8756.
#
# /data is bind-mounted from a separate block-storage volume (mounted on the
# host at /mnt/spotter-data), not the boot disk — the dataset (photos, model
# checkpoints, embeddings) grows well past what a typical droplet's boot disk
# has room for.

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: ghcr.io/michavardy/salamander-spotter:latest
    restart: unless-stopped
    env_file: .env
    volumes:
      - /mnt/spotter-data:/data
    expose:
      - "8756"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8756/api/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  backup:
    image: ghcr.io/michavardy/salamander-spotter:latest
    restart: unless-stopped
    env_file: .env
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "while true; do
         python -m app backup --dest /backups || echo 'backup failed';
         sleep 86400;
       done"
    volumes:
      - /mnt/spotter-data:/data:ro
      - ${SPOTTER_BACKUP_DIR:-./backups}:/backups

volumes:
  caddy-data:
  caddy-config:
