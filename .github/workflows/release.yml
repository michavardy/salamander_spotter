name: release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["app/**", "web/**", "deploy/**", "tests/**", "pixi.toml"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest
      - run: pixi run app:test

  packaging-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f deploy/Dockerfile -t spotter:ci .
      - name: Run image and hit /api/health
        run: |
          docker run -d --name spotter -p 8756:8756 -v "$PWD/ci-data:/data" spotter:ci
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8756/api/health && break || sleep 2
          done
          curl -sf http://127.0.0.1:8756/ >/dev/null
          docker rm -f spotter

  publish:
    runs-on: ubuntu-latest
    needs: [test, packaging-smoke]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
